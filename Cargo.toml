[package]
name = "discodo_launcher"
version = "0.1.0"
edition = "2024"
description = "Open-source desktop game library and launcher"
license = "MIT"
repository = "https://github.com/Torfelka/Discodo_Launcher"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
